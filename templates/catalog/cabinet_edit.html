{% extends 'base.html' %}
{% block title %}Редагування профілю{% endblock %}

{% block extra_css %}
<style>
    .edit-wrap {
        max-width: 560px;
        margin: 0 auto;
        padding-bottom: 4rem;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink-3);
        text-decoration: none;
        padding: 8px 0;
        margin-bottom: 2rem;
        transition: color 0.15s;
    }

    .back-link:hover { color: var(--ink); }

    .page-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
        color: var(--ink);
        margin: 0 0 2rem;
    }

    .page-title em { font-style: italic; color: var(--accent); }

    /* FORM CARD */
    .form-card {
        background: var(--white);
        border: 1px solid var(--cream-3);
        border-radius: 12px;
        overflow: hidden;
    }

    .form-section {
        padding: 20px 20px 0;
        border-bottom: 1px solid var(--cream-2);
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding-bottom: 20px;
    }

    .form-section:last-of-type { border-bottom: none; }

    .form-section-label {
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
        margin-bottom: 0.25rem;
    }

    /* FIELDS */
    .field { display: flex; flex-direction: column; gap: 5px; }

    .field label {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-2);
        letter-spacing: 0.02em;
    }

    .field label .req { color: var(--accent); margin-left: 2px; }

    .field input,
    .field textarea {
        font-family: 'DM Sans', sans-serif;
        font-size: 13.5px;
        color: var(--ink);
        background: var(--cream);
        border: 1px solid var(--cream-3);
        border-radius: 7px;
        padding: 9px 12px;
        outline: none;
        transition: border-color 0.15s, background 0.15s;
        width: 100%;
        resize: none;
    }

    .field input::placeholder,
    .field textarea::placeholder { color: var(--ink-3); }

    .field input:focus,
    .field textarea:focus {
        border-color: var(--ink-3);
        background: var(--white);
    }

    .field input:disabled {
        background: var(--cream-2);
        color: var(--ink-3);
        cursor: not-allowed;
        border-color: var(--cream-3);
    }

    .field textarea { min-height: 88px; }

    .field-hint {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 1px;
    }

    .fields-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    /* ACTIONS */
    .form-actions {
        display: flex;
        gap: 8px;
        padding: 16px 20px;
        background: var(--cream);
        border-top: 1px solid var(--cream-2);
    }

    .btn-save {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 12px 20px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--white);
        font-family: 'DM Sans', sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        border: none;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
    }

    .btn-save:hover { background: var(--accent); }
    .btn-save:active { transform: scale(0.99); }

    .btn-cancel {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 12px 20px;
        border-radius: 8px;
        background: transparent;
        color: var(--ink-3);
        font-family: 'DM Sans', sans-serif;
        font-size: 13.5px;
        text-decoration: none;
        border: 1px solid var(--cream-3);
        transition: all 0.15s;
        white-space: nowrap;
    }

    .btn-cancel:hover { border-color: var(--ink-3); color: var(--ink); }
</style>
{% endblock %}

{% block content %}
<div class="edit-wrap">

    <a href="{% url 'cabinet' %}" class="back-link">
        <i class="bi bi-arrow-left"></i> До кабінету
    </a>

    <h1 class="page-title">Редагування <em>профілю</em></h1>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <!-- Особисті дані -->
            <div class="form-section">
                <p class="form-section-label">Особисті дані</p>

                <div class="fields-row">
                    <div class="field">
                        <label>Ім'я <span class="req">*</span></label>
                        <input type="text" name="first_name"
                               value="{{ request.user.first_name }}"
                               placeholder="Іван" required>
                    </div>
                    <div class="field">
                        <label>Прізвище</label>
                        <input type="text" name="last_name"
                               value="{{ request.user.last_name }}"
                               placeholder="Шевченко">
                    </div>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email" value="{{ request.user.email }}" disabled>
                    <span class="field-hint">Email змінити не можна</span>
                </div>
            </div>

            <!-- Контактна інформація -->
            <div class="form-section">
                <p class="form-section-label">Контактна інформація</p>

                <div class="field">
                    <label>Телефон</label>
                    <input type="text" name="phone"
                           value="{{ profile.phone }}"
                           placeholder="+380991234567">
                </div>

                <div class="field">
                    <label>Адреса доставки</label>
                    <textarea name="address"
                              placeholder="м. Київ, вул. Хрещатик, 1, кв. 10">{{ profile.address }}</textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">
                    <i class="bi bi-check-lg"></i> Зберегти зміни
                </button>
                <a href="{% url 'cabinet' %}" class="btn-cancel">
                    Скасувати
                </a>
            </div>

        </form>
    </div>

</div>
{% endblock %}
